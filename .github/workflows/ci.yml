name: EchoLog CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-test-secret"
      NODE_ENV: test
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./package-lock.json
            ./server/package-lock.json
      - name: Install Root Dependencies
        run: npm ci
        working-directory: .
      - name: Install Server Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Setup Database
        run: npx prisma db push --skip-generate
      - name: Type Check
        run: npx tsc --noEmit
      - name: Run Tests
        run: npm run test --if-present

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./package-lock.json
            ./web/package-lock.json
      - name: Install Root Dependencies
        run: npm ci
        working-directory: .
      - name: Install Web Dependencies
        run: npm ci
      - name: Type Check
        run: npx tsc --noEmit
      - name: Run Tests
        run: npm run test --if-present
